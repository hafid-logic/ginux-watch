# v8.4 — HDAE standing delegation (policy-as-code). Owner-confirmed once (directive v8.4).
# Anything not listed autonomous defaults to human. Consulted by auto-merge + workflows.
version: 1
policy: hdae-standing-delegation
confirmed_by: hafid-logic
confirmed_at: "2026-11-18"
directive: directives/v8.4-20261118.md
default: human
autonomous:
  - read_upstream_api
  - offline_gates
  - state_commits            # matrix/ state/ hdae/ with [skip ci]
  - internal_pr_open
  - internal_pr_merge        # guarded by internal_merge below
  - internal_issue_comment   # reminders/links on OUR repo only
  - alert_renotify_until_ack # internal attention, never upstream nagging
  - upstream_package_prep    # approved/pending only — never publish
human_required:
  - upstream_mutation        # ANY write to gmkurtzer/ginux
  - credential_provision
  - force_push
  - deletion
  - policy_change            # POLICY.md AGENTS.md config/authorization.yml
  - gate_acceptance          # moving a gate into hdae/gates-done/
  - cap_change
  - c2_unlock
  - security_contract_change
internal_merge:
  ci_workflow: ci
  require_conclusion: success
  require_mergeable_state: clean
  same_repo_only: true
  deny_draft: true
  deny_empty: true
  path_denylist:             # guardrails protect themselves — changes here need owner
    - POLICY.md
    - AGENTS.md
    - config/authorization.yml
    - scripts/hooks/
    - scripts/authz_check.py
    - docs/AGENT-SECURITY.md
    - scripts/security_contract_check.py
    - team/scripts/auto-merge.py
    - .github/workflows/auto-merge.yml
    - .github/workflows/supervisor-shadow.yml
    - .github/workflows/decider-space-probe.yml
    - .github/workflows/
    - .github/CODEOWNERS
    - CODEOWNERS
    - scripts/auth_device.py
    - LICENSE
    - NOTICE
  path_allowlist_prefixes:
    - scripts/
    - team/
    - reports/
    - docs/
    - state/
    - hdae/
    - eval/
    - fuzz/
    - matrix/
    - directives/
    - README.md
    - STATE.md
    - HANDOFF.md
  needs_owner_label: needs-owner
exceptions:
  - id: token-in-chat
    decision: owner-deferred
    note: >-
      Credential-free interactive delivery postponed by owner until every
      automation update is implemented and validated, to avoid blocking work.
      Unattended workflows already use the built-in GITHUB_TOKEN only.
    ends_when: owner agrees on the security-item design and approves activation (policy_change is human; enforcement auto-applies once merged)
scheduling:
  mode: event-driven
  events:
    - push(main)
    - workflow_run(ci completed)
    - issues/issue_comment (acknowledgment)
    - repository_dispatch(sweep)
  upstream_poll_cron: "17 */6 * * *"   # external repo emits no events; minimal fallback

# v8.5 — auth tiers (owner-approved plan 2026-11-18). Tier 0 preferred; fallback only on failure.
auth_tiers:
  client_id: Iv23likXwrakJW83j8q7   # GitHub App client id — PUBLIC identifier, not a secret
  supersedes: "v7.1 §6 device-flow prohibition — owner decision 2026-11-18 (directive v8.5)"
  order: [device_flow, upload_file, short_lived_pat, zero_token]
  unattended: GITHUB_TOKEN only (no PATs in workflows)
  transitions_logged: state/action-ledger.jsonl (action=auth_tier_transition, reason required)
  tiers:
    device_flow:
      tier: 0
      method: GitHub App device flow; owner activates user_code; token never enters chat
      token_prefix: ghu_
      ttl_hours: 8
      fallback_when: [exec-env unavailable, device endpoints unreachable, app not configured, owner cannot activate]
    upload_file:
      tier: A
      method: upload/gh-pat.txt -> work/keys 600 -> credential helper -> shred
      fallback_when: [platform has no file upload]
    short_lived_pat:
      tier: B
      method: minimal-scope short-expiry token via context + immediate rotation; never printed/committed
      compensating_controls: [single-repo scope, shortest expiry, rotate after session, byte-scan, work/keys 600, shred]
      fallback_when: [token issuance impossible, high-sensitivity task]
    zero_token:
      tier: C
      method: agent outputs patch + exact commands; owner pushes locally (no token on platform)
