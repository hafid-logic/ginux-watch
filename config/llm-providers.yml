# llm-providers.yml — shadow supervisor provider order
# Generated programmatically (v6.8 items 5/6/8, 2026-11-08) — edit via script,
# never by re-typing. Rules encoded here:
#   * DEFAULT CHAIN (v6.8 item 6) is exactly: google gemini-3.6-flash ->
#     nvidia nvidia/nemotron-3-ultra-550b-a55b -> openrouter/openrouter/free.
#     The FIRST enabled model of each provider is the provider primary; the
#     probe calls ONLY that first model per provider (3 chat calls, not 11).
#   * every other model is SECONDARY and DISABLED (enabled: false) — never
#     called by probe/supervisor/eval until re-enabled explicitly.
#   * paid OpenRouter models (kimi-k3.1-pro, mistral-large-4-0,
#     deepseek-v4.1-flash) are disabled BY DEFAULT (v6.8 item 5): they run
#     only with an explicitly provided paying key. HTTP 402 is terminal:
#     needs_credit, never retried.
#   * openrouter/free is an ALIAS: the actual routed model is read from the
#     response "model" field and logged per call (model_actual); its rows are
#     tagged low_confidence and NEVER enter the quality comparison (v6.8-7);
#     eval summaries group by model_actual.
#   * max_tokens on EVERY call (v6.8 item 5): probe 200 / supervisor 3000 /
#     eval 3000 — without it OpenRouter bills the model default (131072) and
#     free credits 402 instantly ([MEASURED] 2026-11-08 llm-probe.json).
#   * Google /models matching is normalized by stripping the "models/" prefix
#     on both sides (v6.8 item 4; first 5 raw names are logged as evidence).
# NO SECRETS IN THIS FILE — secret NAMES only (env var names, GitHub Actions
# environment: supervisor).
version: 1
updated: '2026-11-08'
request_timeout_s: 120
attempts_per_model: 2
backoff_s: 5
max_consecutive_failures_for_down: 3
circuit_breaker_skip_s: 1800
daily_call_cap_per_provider: 60
eval_daily_call_cap_per_provider: 40
probe_daily_call_cap_per_provider: 40
probe_max_tokens: 200
supervisor_max_tokens: 3000
eval_max_tokens: 3000
eval_not_before_utc: '2026-11-09T00:00:00Z'
providers:
- name: google-ai-studio
  env_secret: GOOGLE_AI_API_KEY
  base_url: https://generativelanguage.googleapis.com/v1beta/openai
  # v7.0-3a official limits (fetched 2026-11-09); measured headers/429
  # override when present (v6.4 capture_rate_limit wins per directive)
  limits_official:
    rpm: null
    rpd: null
    tpm: null
    min_interval_s: 6
    limits_source: official_doc
    source_url: https://ai.google.dev/gemini-api/docs/rate-limits
    fetched_at: '2026-11-09'
    quote: 'Rate limits are usually measured across three dimensions: RPM, TPM, RPD'
  request_timeout_s: 120
  verify_at_runtime: true
  models:
  - id: gemini-3.6-flash
    status: unverified
    note: 'v6.8-4: primary; /models match normalized (strip models/ prefix); one live probe after fix;
      id_absent -> unavailable + report'
  - id: gemini-2.5-flash
    status: available
    enabled: false
    note: secondary, disabled (v6.8-6); [MEASURED] 2026-11-08 id_absent against 61 listed ids (models/
      prefix)
  - id: gemini-2.5-pro
    status: available
    enabled: false
    note: secondary, disabled (v6.8-6)
- name: nvidia
  env_secret: NVIDIA_API_KEY
  base_url: https://integrate.api.nvidia.com/v1
  # v7.0-3a official limits (fetched 2026-11-09, NVIDIA developer forums);
  # measured headers/429 override when present (v6.4)
  limits_official:
    rpm: 40
    rpd: null
    tpm: null
    min_interval_s: 1.5
    limits_source: official_doc
    source_url: https://forums.developer.nvidia.com/t/request-for-nvidia-nim-api-rate-limit-increase-40-to-200-rpm/374542
    fetched_at: '2026-11-09'
    quote: 'The default limit of 40 Requests Per Minute (RPM)'
  request_timeout_s: 300
  models:
  - id: nvidia/nemotron-3-ultra-550b-a55b
    status: unverified
    note: 'v6.8-6: mandated primary; verify via /models at probe time; [MEASURED] 2026-11-08 http_404
      on chat call — probe re-checks and reports'
  - id: deepseek-ai/deepseek-v4.1-flash
    status: available
    enabled: false
    note: secondary, disabled (v6.8-6); [MEASURED] served the 2026-11-08 05:54Z success
  - id: moonshotai/kimi-k2.6
    status: available
    enabled: false
    note: secondary, disabled (v6.8-6)
  - id: mistralai/mistral-large-4-1t-a52b
    status: available
    enabled: false
    note: secondary, disabled (v6.8-6)
- name: openrouter
  env_secret: OPENROUTER_API_KEY
  base_url: https://openrouter.ai/api/v1
  # v7.0-3a official limits (fetched 2026-11-09); note: free RPD 50 is BELOW
  # our configured caps — owner decision needed (reported 2026-11-10)
  limits_official:
    rpm: 20
    rpd: 50
    tpm: null
    min_interval_s: 3.0
    limits_source: official_doc
    source_url: https://openrouter.ai/docs/api_reference/limits
    fetched_at: '2026-11-09'
    quote: 'capped at 20 requests per minute and 50 per day'
  request_timeout_s: 180
  models:
  - id: openrouter/free
    status: unverified
    verify_via_models: false
    low_confidence: true
    note: 'v6.8-7: ALIAS primary; not in the /models catalog — verified only by the functional probe;
      model_actual read from response.model and logged per call; rows tagged low_confidence, excluded
      from the quality comparison; eval summaries group by model_actual; no-route -> unavailable'
  - id: moonshotai/kimi-k3.1-pro
    status: available
    enabled: false
    paid: true
    note: 'v6.8-5: PAID, disabled by default; runs only with an explicit paying key; 402 -> needs_credit,
      no retry ([MEASURED] 2026-11-08)'
  - id: deepseek/deepseek-v4.1-flash
    status: available
    enabled: false
    paid: true
    note: 'v6.8-5: PAID, disabled by default; explicit key required to enable'
  - id: mistralai/mistral-large-4-0
    status: available
    enabled: false
    paid: true
    note: 'v6.8-5: PAID, disabled by default; 402 -> needs_credit, no retry ([MEASURED] 2026-11-08)'
