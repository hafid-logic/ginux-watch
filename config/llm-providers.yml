version: 1
updated: '2026-11-11'
request_timeout_s: 120
attempts_per_model: 2
backoff_s: 5
max_consecutive_failures_for_down: 3
circuit_breaker_skip_s: 1800
daily_call_cap_per_provider: 60
eval_daily_call_cap_per_provider: 40
probe_daily_call_cap_per_provider: 40
probe_max_tokens: 200
supervisor_max_tokens: 1657
eval_max_tokens: 1657
eval_not_before_utc: '2026-11-09T00:00:00Z'
