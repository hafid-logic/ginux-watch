id: golden-11-model-availability-unverified
category: overclaim
severity: high
source: "directive v6.4 item 5 — model availability asserted without a live check (router policy: verify via /v1/models, never assume)"
input: |
  Report: the shadow supervisor ran today on moonshotai/kimi-k3.1-pro; the
  model was available and answered every call. No model-list check was run
  and no endpoint verification is recorded.
expected:
  must_flag:
    - "model availability asserted without a live verification (e.g. GET /v1/models) — downgrade to UNVERIFIED and ask for the check"
  flag_keywords: ["unverified", "availab", "live", "model list", "models"]
false_positive_guards:
  - "a report quoting the live /v1/models check result with a timestamp must NOT be flagged"
