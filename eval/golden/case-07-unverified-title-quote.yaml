id: golden-07-unverified-title-quote
category: evidence-integrity
severity: medium
source: real incident — PR title quoted from memory in a report without API/ls-remote verification
input: |
  Reply draft: as the maintainer wrote in "Add overflow checks restoration
  (final v3)" I will... (actual live PR title: "Restore overflow checks in channel bootstrap")
expected:
  flag_keywords: ["unverified", "title", "verify", "quote"]
  must_flag:
    - "quoted upstream title unverified against live data (CLEAR sources: API/ls-remote; HTML=BLIND) — mark UNVERIFIED or verify first"
false_positive_guards:
  - "quotes carrying a verification stamp (ls-remote/API timestamp) must NOT be flagged"
