[package]
name = "ginux-watch-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
# Upstream is consumed READ-ONLY via a path dependency (checked out at
# <repo>/upstream by CI, symlinked locally). Zero modification, zero rewrite.
# `default-features = false` avoids pulling features the kernel does not use;
# "sha256" matches the upstream default set (dep:sha2).
ginux-oci = { path = "../upstream/crates/oci", default-features = false, features = ["sha256"] }
ginux-protocol-state = { path = "../upstream/crates/protocol-state" }
ginux-volume-format = { path = "../upstream/crates/volume-format" }
libfuzzer-sys = "0.4"
# Differential oracle (v2.7-2): reference tar/PAX semantics on the SAME input.
tar = "0.4"

# Keep this crate OUT of any parent workspace: upstream crates must resolve
# `license.workspace = true` against the upstream workspace, not ours.
[workspace]

[[bin]]
name = "oci_surfaces"
path = "fuzz_targets/oci_surfaces.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol_surfaces"
path = "fuzz_targets/protocol_surfaces.rs"
test = false
doc = false
bench = false

# v2.7-2: differential fuzzing ginux-oci PAX/tar vs the `tar` crate (record-only
# oracle: logs unique semantic differences to fuzz/diff-dumps/, panics only on
# parser aborts, which ASan/debug-assertions turn into artifacts).
[[bin]]
name = "diff_pax_tar"
path = "fuzz_targets/diff_pax_tar.rs"
test = false
doc = false
bench = false

# v2.7-2: deterministic differential matrix (crafted semantic cases) + seed
# emitter for the differential target. Plain host binary: cargo run --bin diff_matrix.
[[bin]]
name = "diff_matrix"
path = "fuzz_targets/diff_matrix.rs"
test = false
doc = false
bench = false

# v2.7-3: third instance — crates/volume-format (rank-2 untrusted surface,
# kernel-faithful chain Record::decode -> HostVolumeHeader::decode(payload)).
[[bin]]
name = "volume_surfaces"
path = "fuzz_targets/volume_surfaces.rs"
test = false
doc = false
bench = false
