name: descriptors-modtests-v2
on:
  push:
    branches: [repro/descriptors-modtests]
permissions:
  contents: read
jobs:
  rework:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with: {repository: gmkurtzer/ginux, ref: 7fb6e093719780289e38fdae7b0d2e9e1c12efe4, path: upstream}
      - name: Decode payloads
        run: |
          echo  | base64 -d > /tmp/tests.rs
          echo ZnJvbSBwYXRobGliIGltcG9ydCBQYXRoCnA9UGF0aCgiY3JhdGVzL2dpbnV4LWRldmljZXMvc3JjL2xpYi5ycyIpOyB0PXAucmVhZF90ZXh0KCkKdGVzdHM9UGF0aCgiL3RtcC90ZXN0cy5ycyIpLnJlYWRfdGV4dCgpCmk9dC5yZmluZCgifSIpCnAud3JpdGVfdGV4dCh0WzppXSt0ZXN0cyt0W2k6XSkK | base64 -d > /tmp/insert.py
          echo  | base64 -d > /tmp/mut.py
      - name: Insert into mod tests + fmt + clippy
        working-directory: upstream
        run: |
          python3 /tmp/insert.py
          cargo fmt -p ginux-devices
          cargo fmt -p ginux-devices -- --check
          RUSTFLAGS='' cargo clippy -p ginux-devices --all-targets -- -D warnings 2>&1 | tee ../clippy.log
          git diff > ../descriptors-modtests.patch
      - name: Baseline full suite clean PASS
        working-directory: upstream
        run: RUSTFLAGS='' CARGO_TARGET_DIR=.artifacts/unit cargo test -p ginux-devices --lib 2>&1 | tee ../baseline.log
      - name: Mutants survive-existing killed-with-ours
        working-directory: upstream
        run: |
          set +e
          SKIP="--skip raw_index_is_invalid_descriptor --skip close_invalidates_and_frees_slot"
          for m in m2 m5 m11; do
            git checkout -- crates/ginux-devices/src/lib.rs
            python3 /tmp/mut.py $m
            RUSTFLAGS='' CARGO_TARGET_DIR=.artifacts/$m cargo test -p ginux-devices --lib -- $SKIP 2>&1 | tee ../$m-existing.log; echo "existing_exit=${PIPESTATUS[0]}" | tee -a ../$m-existing.log
            python3 /tmp/insert.py
            RUSTFLAGS='' CARGO_TARGET_DIR=.artifacts/$m cargo test -p ginux-devices --lib 2>&1 | tee ../$m-ours.log; echo "ours_exit=${PIPESTATUS[0]}" | tee -a ../$m-ours.log
          done
          git checkout -- crates/ginux-devices/src/lib.rs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: descriptors-modtests-evidence
          path: |
            clippy.log
            baseline.log
            descriptors-modtests.patch
            m2-existing.log
            m2-ours.log
            m5-existing.log
            m5-ours.log
            m11-existing.log
            m11-ours.log
