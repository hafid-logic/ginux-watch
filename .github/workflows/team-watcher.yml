name: team-watcher
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: team-watcher
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lease sweep (expired claim_until -> stale + requeue)
        run: python3 team/scripts/lease-sweep.py
      - name: Commit and push
        run: |
          git config user.name "team-watcher"
          git config user.email "actions@users.noreply.github.com"
          git add -A team/tasks/
          if ! git diff --cached --quiet; then
            git commit -m "lease sweep $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            git push
          else
            echo "no expired leases"
          fi
