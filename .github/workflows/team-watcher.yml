name: team-watcher
on:
  push:
    branches: [main]          # v8.4-B: event-driven; watcher's own [skip ci] commits do not retrigger
  repository_dispatch:
    types: [sweep]            # v8.4-B: external/manual event hook
  schedule:
    - cron: "17 */6 * * *"    # v8.4-B: minimal fallback poll — external upstream emits no events
  workflow_dispatch:
    inputs:
      simulate:
        description: "Open a test TRIPPED issue then close it (v6.5b-3)"
        type: boolean
        default: false
concurrency:
  group: team-watcher
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Sensitive-path drift audit (v8.8 — immune to [skip ci]; TRIPPED on drift)
        env:
          GH_TOKEN: ${{ github.token }}
          SENSITIVE_PINS: '{".github/CODEOWNERS": "f7ecc1ec5d17c91c539ae14e40b6c273ff78b47adb57bd32c2857c7bfad29a60", "CODEOWNERS": "ABSENT", "LICENSE": "c71d239df91726fc519c6eb72d318ec65820627232b2f796219e87dcf35d0ab4", "NOTICE": "e57f0d594514f4e0345718898809bf0bf457a82c82c5f2960bc8f6eca1be6704", "config/authorization.yml": "cf44070260272e74c1c2390e7430c913a43a4e4027e3fe5979a45100af7fc415", "docs/AGENT-SECURITY.md": "39f5807bff2268d75be9e2b96b9e052b4b1de7793fa892736491c6ba6cba8cf6", "docs/DRIFT-AUDIT.md": "b5149d14d5593394cf065de7de589441b5a55eef1fd256d885466968ecba10bd", "scripts/auth_device.py": "154f9a32211042bda2dcd5217eeabddcc226ed30daf310daa9d9e193770415ff", "team/scripts/auto-merge.py": "ec5fc103c83b97989897ecdff2374ebbf6890b6bd4fc6733209729de4c45fc3c", "team/scripts/sensitive-drift-audit.py": "e3903debe3e3f6445cf5c7c97edd1fb4bef2f492695e49ed62538b1407520031"}'
        run: python3 team/scripts/sensitive-drift-audit.py --open-issue
      - name: Offline heartbeat semantics test (v7.3-2d — alert basis last_success; failed run is not a pulse)
        run: python3 team/scripts/test-heartbeat-check.py
      - name: Report lint offline tests (v7.5-1 — clauses a..h fixtures + measured defect matrix)
        run: python3 team/scripts/test-report-lint.py
      - name: Decider gate asymmetry tests (v7.5-3 — alert = det OR decider, mute from det only)
        run: python3 team/scripts/test-decider-gate.py
      - name: Decider case loader validation (v7.5-3 — offline harness, zero network)
        run: python3 scripts/decider_eval.py
      - name: Report lint on reports changed by this push (v7.5-1 — CI half of the pre-commit gate)
        run: |
          before="${{ github.event.before }}"
          [ -z "$before" ] && before="HEAD~1"
          # ALERT-*.md are automation alert banners (non-reports) — excluded like INDEX/LATEST/_TEMPLATE (v8.3.1)
          changed=$(git diff --name-only "$before" HEAD -- 'outbox/*.md' | grep -v -E 'outbox/(INDEX|LATEST|_TEMPLATE|ALERT-.*)\.md' || true)
          if [ -n "$changed" ]; then
            python3 scripts/report_lint.py --check $changed
          else
            echo "no outbox reports changed — nothing to lint-check"
          fi
      - name: Security contract gate (v8.6 — every sweep)
        run: python3 scripts/security_contract_check.py
      - name: Token-pattern scan of tree (v6.6 item 5; fails on any full-form token except ghp_SYNTHETIC-*)
        run: python3 scripts/tree-token-scan.py
      - name: Sync open-PR refs into STATE.md (v9.2)
        run: python3 scripts/sync-open-pr-refs.py
      - name: PR-STATE cross-reference (v8.3-ب — continuous enforcement on main)
        run: python3 scripts/pr-state-xref.py
      - name: Lease sweep (expired claim_until -> stale + requeue)
        run: python3 team/scripts/lease-sweep.py
      - name: Upstream parser-crate watch (v3.2 §2)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 team/scripts/upstream-watch.py
      - name: TRIPPED notify + simulate test (v6.5b-3)
        env:
          GH_TOKEN: ${{ github.token }}
          SIMULATE: ${{ inputs.simulate }}
        run: python3 team/scripts/trip-notify.py
      - name: Alert acknowledgment sweep (v8.4-C — repeat until owner ack)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 team/scripts/alert-ack.py
      - name: Commit and push
        run: |
          git config user.name "team-watcher"
          git config user.email "actions@users.noreply.github.com"
          git add -A team/tasks/ matrix/ state/alerts.json state/action-ledger.jsonl STATE.md
          if ! git diff --cached --quiet; then
            msg="lease sweep $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if git diff --cached --name-only | grep -q upstream-watch; then
              msg="upstream watch + lease sweep $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            fi
            git commit -m "$msg [skip ci]"
            # v7.3-2c: run 29 (2026-11-09T21:41:49Z) failed here with exit 128
            # (instant git-transport failure, no competing commit on main
            # [MEASURED]) — 3-attempt rebase+push, mirroring supervisor-shadow.
            # -X theirs = on a same-file state race the FRESH sweep hunks win
            # (rebase semantics: replayed commit wins); rebase --abort resets
            # between attempts. Offline simulation:
            # team/scripts/test-push-retry-offline.sh
            ok=0
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin main && git push; then ok=1; break; fi
              git rebase --abort >/dev/null 2>&1 || true
              sleep $((i * 5))
            done
            if [ "$ok" != 1 ]; then
              echo "push failed after 3 attempts"
              exit 1
            fi
          else
            echo "no changes"
          fi
      - name: Heartbeat finalize (v7.3-2d — a failed run never counts as a healthy pulse)
        if: failure()
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 team/scripts/heartbeat-finalize.py
