name: team-watcher
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      simulate:
        description: "Open a test TRIPPED issue then close it (v6.5b-3)"
        type: boolean
        default: false
concurrency:
  group: team-watcher
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Offline heartbeat semantics test (v7.3-2d — alert basis last_success; failed run is not a pulse)
        run: python3 team/scripts/test-heartbeat-check.py
      - name: Token-pattern scan of tree (v6.6 item 5; fails on any full-form token except ghp_SYNTHETIC-*)
        run: python3 scripts/tree-token-scan.py
      - name: Lease sweep (expired claim_until -> stale + requeue)
        run: python3 team/scripts/lease-sweep.py
      - name: Upstream parser-crate watch (v3.2 §2)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 team/scripts/upstream-watch.py
      - name: TRIPPED notify + simulate test (v6.5b-3)
        env:
          GH_TOKEN: ${{ github.token }}
          SIMULATE: ${{ inputs.simulate }}
        run: python3 team/scripts/trip-notify.py
      - name: Commit and push
        run: |
          git config user.name "team-watcher"
          git config user.email "actions@users.noreply.github.com"
          git add -A team/tasks/ matrix/
          if ! git diff --cached --quiet; then
            msg="lease sweep $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if git diff --cached --name-only | grep -q upstream-watch; then
              msg="upstream watch + lease sweep $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            fi
            git commit -m "$msg [skip ci]"
            git push
          else
            echo "no changes"
          fi
      - name: Heartbeat finalize (v7.3-2d — a failed run never counts as a healthy pulse)
        if: failure()
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 team/scripts/heartbeat-finalize.py
