name: team-validator
on:
  push:
    paths:
      - "team/results/**"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: team-validator
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate results (format, tags, evidence, secrets)
        run: python3 team/scripts/validate-result.py --enforce team/results
      - name: Commit validation output
        run: |
          git config user.name "team-validator"
          git config user.email "actions@users.noreply.github.com"
          git add -A team/
          if ! git diff --cached --quiet; then
            git commit -m "validation batch $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            git push
          else
            echo "no validation changes"
          fi
