name: package-prover
# Runner-side HDAE proof + screening (no local tool quota). Proves every stock
# package (baseline + >=2 surviving mutants killed) and archives merged/stale.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
  repository_dispatch:
    types: [prove-packages]
  push:
    paths: ["approved/pending/**"]
permissions:
  contents: write
concurrency:
  group: package-prover
  cancel-in-progress: false
jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Screen stock (archive merged/stale/duplicate)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 team/scripts/screen-stock.py
      - name: Prove packages on runner
        run: python3 team/scripts/prove-package.py
      - name: Commit proof + screening results
        run: |
          git config user.name "package-prover"
          git config user.email "actions@users.noreply.github.com"
          git add -A state/proven.json approved/
          if ! git diff --cached --quiet; then
            git commit -m "prover: runner proof + stock screening [skip ci]"
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin main && git push; then break; fi
              git rebase --abort >/dev/null 2>&1 || true; sleep $((i*5))
            done
          fi
