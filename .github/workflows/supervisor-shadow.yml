name: supervisor-shadow
on:
  push:
    branches: [main]
    paths:
      - outbox/**
  workflow_dispatch: {}
  schedule:
    # fallback pulse every 6 hours (primary trigger: outbox/** push)
    - cron: "17 */6 * * *"

concurrency:
  group: supervisor-shadow
  cancel-in-progress: false

permissions: {}

jobs:
  shadow:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: supervisor
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml jsonschema

      - name: Offline self-tests
        run: |
          python3 team/scripts/issue-sanitize.py --selftest
          python3 team/scripts/test-trip-notify-xref.py

      - name: Shadow supervisor run (no set -x, no env echo)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
        run: python3 scripts/llm_supervisor.py

      - name: Commit shadow outputs
        run: |
          git config user.name "supervisor-shadow"
          git config user.email "actions@users.noreply.github.com"
          git add -A shadow state outbox
          if ! git diff --cached --quiet; then
            git commit -m "shadow supervisor output $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            git push
          else
            echo "no shadow changes"
          fi
