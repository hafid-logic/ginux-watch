name: supervisor-shadow
on:
  push:
    branches: [main]
    paths:
      - outbox/**
    paths-ignore:
      # ALERT files are committed by this workflow itself (idempotent
      # content) — never retrigger on them (v6.4 item 4 anti-loop)
      - "outbox/ALERT-llm-*"
  workflow_dispatch: {}
  schedule:
    # fallback pulse every 6 hours (primary trigger: outbox/** push)
    - cron: "17 */6 * * *"

concurrency:
  group: supervisor-shadow
  cancel-in-progress: false

permissions: {}

jobs:
  shadow:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: supervisor
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml jsonschema

      - name: Offline self-tests (mock LLM, no provider network)
        run: |
          python3 team/scripts/test-trip-notify-xref.py
          python3 team/scripts/test-llm-shadow.py

      - name: Shadow supervisor run (no set -x, no env echo)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
        run: python3 scripts/llm_supervisor.py

      - name: Golden eval run (results file written even when providers fail)
        if: always()
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
        run: python3 scripts/run_golden_eval.py

      # v6.4 item 4: state/llm-status.json and eval/results/<date>.json are
      # committed EVEN ON FAILURE (if: always()) so the agent can read them
      # from git without spending API quota. Explicit paths only — no add -A.
      - name: Commit artifacts (state + shadow + eval, even on failure)
        if: always()
        run: |
          git config user.name "supervisor-shadow"
          git config user.email "actions@users.noreply.github.com"
          git add shadow state eval outbox
          if ! git diff --cached --quiet; then
            git commit -m "shadow/eval artifacts $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            git push
          else
            echo "no shadow/eval changes"
          fi
