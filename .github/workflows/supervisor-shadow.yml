name: supervisor-shadow
on:
  push:
    branches:
      - main
    paths:
      - "outbox/**"
      - "!outbox/ALERT-llm-*"
  workflow_dispatch:
    inputs:
      run_eval:
        description: "Run the golden eval (SEPARATE cap, v6.7-1). Push/schedule runs NEVER run eval."
        type: boolean
        required: false
        default: false
      supervisor_input:
        description: "Optional explicit llm_supervisor.py --input path (trap tests / re-runs, v7.3-3/4). '__SKIP__' runs NO supervisor call (eval-only dispatch). Empty = default outbox/LATEST.md."
        type: string
        required: false
        default: ""
      supervisor_report_id:
        description: "Optional explicit --report-id (synthetic inputs MUST carry a TEST tag, v7.3-3)."
        type: string
        required: false
        default: ""
      supervisor_force:
        description: "Pass --force to llm_supervisor.py (re-run an already-produced report id)."
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: supervisor-shadow
  cancel-in-progress: false

permissions: {}

jobs:
  shadow:
    # v7.3-3/4: __SKIP__ skips only the SUPERVISOR call (eval-only dispatch) —
    # the job must still run the eval step; hence the run_eval escape below.
    if: github.ref == 'refs/heads/main' && (inputs.supervisor_input != '__SKIP__' || inputs.run_eval == true)
    runs-on: ubuntu-24.04
    environment: supervisor
    permissions:
      contents: write
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml jsonschema

      - name: Offline self-tests (mock LLM, no provider network)
        run: |
          python3 team/scripts/test-trip-notify-xref.py
          python3 team/scripts/test-llm-shadow.py
          python3 team/scripts/test-shadow-failure-handling.py

      # appendix v6.6 item 11: per-model probe BEFORE the supervisor — a model
      # whose probe failed never receives the full input (router gates on
      # state/llm-probe.json); /models verification marks absent ids
      # unavailable (appendix item 8). Probe exit is always 0 unless the probe
      # itself crashes on local infrastructure.
      - name: Provider probe (fixed input + /models verification)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
        run: python3 scripts/llm_probe.py

      - name: Shadow supervisor run
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          SUPERVISOR_INPUT: ${{ inputs.supervisor_input }}
          SUPERVISOR_REPORT_ID: ${{ inputs.supervisor_report_id }}
          SUPERVISOR_FORCE: ${{ inputs.supervisor_force }}
        run: |
          if [ "$SUPERVISOR_INPUT" = "__SKIP__" ]; then
            echo "supervisor: skipped (__SKIP__ — eval-only dispatch, v7.3 eval الثاني)"
            exit 0
          fi
          ARGS=""
          if [ -n "$SUPERVISOR_INPUT" ] && [ "$SUPERVISOR_INPUT" != "__SKIP__" ]; then
            ARGS="$ARGS --input $SUPERVISOR_INPUT"
          fi
          if [ -n "$SUPERVISOR_REPORT_ID" ]; then
            ARGS="$ARGS --report-id $SUPERVISOR_REPORT_ID"
          fi
          if [ "$SUPERVISOR_FORCE" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python3 scripts/llm_supervisor.py $ARGS

      # v6.7 item 1: the golden eval runs ONLY via workflow_dispatch with
      # input run_eval=true and consumes its OWN daily cap (calls_eval);
      # run_golden_eval.py additionally refuses without GOLDEN_EVAL_GATE —
      # a push/schedule trigger can never spend eval calls.
      - name: Golden eval run (dispatch + run_eval=true only)
        if: github.event_name == 'workflow_dispatch' && inputs.run_eval == true
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          GOLDEN_EVAL_GATE: run_eval-${{ inputs.run_eval }}
        run: python3 scripts/run_golden_eval.py

      # v6.7 item 1: show the ACTUAL consumed daily cap in the job summary
      # (per provider per purpose: supervisor / eval / probe).
      - name: Daily cap consumption summary (v6.7-1)
        if: always()
        run: python3 scripts/llm_cap_summary.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-eval-${{ github.run_id }}
          path: |
            shadow/
            state/llm-status.json
            state/llm-probe.json
            eval/results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit artifacts (state + shadow + eval, even on failure)
        if: always()
        run: |
          git config user.name "supervisor-shadow"
          git config user.email "actions@users.noreply.github.com"
          git add shadow state eval outbox
          if git diff --cached --quiet; then
            echo "no shadow/eval changes"
            exit 0
          fi
          git commit -m "shadow/eval artifacts $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep $((i * 5))
          done
          echo "push failed after 3 attempts"
          exit 1
