name: probe-overflow-evidence

# v5.3 (2026-11-06): #222 owner-reply evidence probe, per directive v5.3-3/4/5.
# Three deliverables the maintainer asked for on issue #222, MEASURED on runners
# at a pinned upstream SHA (3f2fe7df = main at probe time), plus the T1-T3 PoC
# for PR #207. READ-ONLY wrt upstream: public clone, no push. Triggers only
# when this file itself changes on the probe branch (plus manual dispatch).

on:
  push:
    branches: [probe/v53-evidence-2026-11-06]
    paths: [".github/workflows/probe-overflow-evidence.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PIN: "3f2fe7dfadd4b40e235d982a6a3d386dc6490177"

jobs:
  ubuntu-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: clone upstream at pinned SHA
        run: |
          git clone -q https://github.com/gmkurtzer/ginux.git src
          git -C src checkout -q "$PIN"
          git -C src rev-parse HEAD
      - name: toolchain
        run: rustup target add x86_64-unknown-linux-gnu

      - name: baseline build — self-start bins, upstream config untouched
        run: |
          cd src
          CARGO_TARGET_DIR=../art-base cargo build --release -p ginux-init 2>&1 | tail -1
          echo "BUILD_SELFSTART_EXIT=${PIPESTATUS[0]}"
      - name: baseline build — ginux-vfs-index (RUSTFLAGS override, documented deviation)
        run: |
          cd src
          RUSTFLAGS="-C linker=cc" CARGO_TARGET_DIR=../art-base-cc \
            cargo build --release -p ginux-vfs-index -p managed-payload \
            -p baseline-runner -p runtime-fixture -p process-native-fixture 2>&1 | tail -1
          echo "BUILD_VFSINDEX_EXIT=${PIPESTATUS[0]} (upstream .cargo/config.toml lld flags cannot link std bins; upstream CI never links this crate either)"
      - name: flag build — self-start bins (CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS=true)
        run: |
          cd src
          CARGO_TARGET_DIR=../art-flag CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS=true \
            cargo build --release -p ginux-init 2>&1 | tail -1
          echo "BUILD_SELFSTART_FLAG_EXIT=${PIPESTATUS[0]}"
      - name: flag build — ginux-vfs-index (flag + linker override)
        run: |
          cd src
          RUSTFLAGS="-C linker=cc" CARGO_TARGET_DIR=../art-flag-cc CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS=true \
            cargo build --release -p ginux-vfs-index -p managed-payload \
            -p baseline-runner -p runtime-fixture -p process-native-fixture 2>&1 | tail -1
          echo "BUILD_VFSINDEX_FLAG_EXIT=${PIPESTATUS[0]}"
      - name: sizes table (bytes)
        run: |
          printf "%-26s %12s %12s %10s\n" binary base flag delta
          for b in ginux; do
            s1=$(stat -c%s "art-base/release/$b" 2>/dev/null || echo NA)
            s2=$(stat -c%s "art-flag/release/$b" 2>/dev/null || echo NA)
            d=NA; [ "$s1" != NA ] && [ "$s2" != NA ] && d=$((s2-s1))
            printf "%-26s %12s %12s %10s\n" "$b" "$s1" "$s2" "$d"
          done
          s1=$(stat -c%s "art-base-cc/release/ginux-vfs-index" 2>/dev/null || echo NA)
          s2=$(stat -c%s "art-flag-cc/release/ginux-vfs-index" 2>/dev/null || echo NA)
          d=NA; [ "$s1" != NA ] && [ "$s2" != NA ] && d=$((s2-s1))
          printf "%-26s %12s %12s %10s\n" "ginux-vfs-index(cc)" "$s1" "$s2" "$d"

      - name: make test-unit (baseline)
        run: make -C src test-unit 2>&1 | grep -E 'test result|error' | sort | uniq -c
      - name: make test-unit (flag)
        run: env CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS=true make -C src test-unit 2>&1 | grep -E 'test result|error' | sort | uniq -c

      - name: launch + native supervision (baseline)
        run: |
          make -C src build build-launch-fixture build-process-fixtures 2>&1 | tail -1
          sudo make -C src test-launch 2>&1 | tail -2
          sudo make -C src test-native-supervision 2>&1 | tail -2
          make -C src test-process-native 2>&1 | tail -2
      - name: launch + native supervision (flag)
        run: |
          cd src && git checkout -- . 2>/dev/null || true
          env CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS=true make build build-launch-fixture build-process-fixtures 2>&1 | tail -1
          cd ..
          env CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS=true sudo -E make -C src test-launch 2>&1 | tail -2
          env CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS=true sudo -E make -C src test-native-supervision 2>&1 | tail -2
          env CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS=true make -C src test-process-native 2>&1 | tail -2

      - name: canary — release WITHOUT flag must FAIL (defect reproduced)
        run: |
          cd src
          mkdir -p crates/ginux-vfs-index/tests
          cp ../approved/pr/2026-11-06-overflow-checks/overflow_checks_release.rs crates/ginux-vfs-index/tests/
          mv .cargo/config.toml .cargo/config.toml.probe-bak   # freestanding link flags not for std test bins
          RUSTFLAGS="-C linker=cc" CARGO_TARGET_DIR=../art-c1 \
            cargo test --release -p ginux-vfs-index --test overflow_checks_release 2>&1 | tail -6
          rc=${PIPESTATUS[0]}
          mv .cargo/config.toml.probe-bak .cargo/config.toml
          echo "CANARY_C1_EXIT=$rc"
          [ "$rc" = "101" ] && echo "C1 PASS-AS-EXPECTED (test failed on pristine main = defect reproduced)" || echo "C1 UNEXPECTED exit=$rc"
      - name: canary — release WITH flag must PASS
        run: |
          cd src
          mv .cargo/config.toml .cargo/config.toml.probe-bak
          RUSTFLAGS="-C linker=cc" CARGO_TARGET_DIR=../art-c2 CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS=true \
            cargo test --release -p ginux-vfs-index --test overflow_checks_release 2>&1 | tail -4
          rc=${PIPESTATUS[0]}
          mv .cargo/config.toml.probe-bak .cargo/config.toml
          echo "CANARY_C2_EXIT=$rc"
          [ "$rc" = "0" ] && echo "C2 PASS-AS-EXPECTED (fix works)" || echo "C2 UNEXPECTED exit=$rc"
      - name: canary — debug cannot detect (must PASS either way)
        run: |
          cd src
          mv .cargo/config.toml .cargo/config.toml.probe-bak
          RUSTFLAGS="-C linker=cc" CARGO_TARGET_DIR=../art-c3 \
            cargo test -p ginux-vfs-index --test overflow_checks_release 2>&1 | tail -3
          rc=${PIPESTATUS[0]}
          mv .cargo/config.toml.probe-bak .cargo/config.toml
          echo "CANARY_C3_DEBUG_EXIT=$rc"

      - name: vfs-index scan timing — 12 alternating runs per binary, median+range
        run: mkdir -p ev && python3 scripts/vfs-scan-timing.py ./ev art-base-cc/release/ginux-vfs-index art-flag-cc/release/ginux-vfs-index

  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: clone upstream at pinned SHA
        run: |
          git clone -q https://github.com/gmkurtzer/ginux.git src
          git -C src checkout -q "$PIN"
          git -C src rev-parse HEAD
          echo "host target: $(rustc -vV 2>/dev/null | grep host || rustc --version)"
      - name: baseline + flag builds (host arm64) + sizes
        run: |
          cd src
          CARGO_TARGET_DIR=../art-base cargo build --release -p ginux-init -p ginux-vfs-index 2>&1 | tail -3
          echo "MACOS_BUILD_BASE_EXIT=${PIPESTATUS[0]}"
          CARGO_TARGET_DIR=../art-flag CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS=true \
            cargo build --release -p ginux-init -p ginux-vfs-index 2>&1 | tail -3
          echo "MACOS_BUILD_FLAG_EXIT=${PIPESTATUS[0]}"
          printf "%-20s %12s %12s %10s\n" binary base flag delta
          for b in ginux ginux-vfs-index; do
            s1=$(stat -f%z "../art-base/release/$b" 2>/dev/null || echo NA)
            s2=$(stat -f%z "../art-flag/release/$b" 2>/dev/null || echo NA)
            d=NA; [ "$s1" != NA ] && [ "$s2" != NA ] && d=$((s2-s1))
            printf "%-20s %12s %12s %10s\n" "$b" "$s1" "$s2" "$d"
          done
      - name: make test-unit (baseline + flag)
        run: |
          make -C src test-unit 2>&1 | grep -E 'test result|error' | sort | uniq -c
          env CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS=true make -C src test-unit 2>&1 | grep -E 'test result|error' | sort | uniq -c
      - name: canary (release without flag FAIL / with flag PASS / debug PASS)
        run: |
          cd src
          mkdir -p crates/ginux-vfs-index/tests
          cp ../approved/pr/2026-11-06-overflow-checks/overflow_checks_release.rs crates/ginux-vfs-index/tests/
          RUSTFLAGS="" CARGO_TARGET_DIR=../art-c1 \
            cargo test --release -p ginux-vfs-index --test overflow_checks_release 2>&1 | tail -4
          echo "CANARY_C1_EXIT=${PIPESTATUS[0]} (expect 101 = FAIL reproduced)"
          RUSTFLAGS="" CARGO_TARGET_DIR=../art-c2 CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS=true \
            cargo test --release -p ginux-vfs-index --test overflow_checks_release 2>&1 | tail -3
          echo "CANARY_C2_EXIT=${PIPESTATUS[0]} (expect 0 = fix works)"
      - name: launch/native note
        run: |
          echo "skipped on macOS: ginux launch/native supervision tests are linux-specific"

  poc207-t123:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: build harness
        run: |
          gcc --version | head -1
          cc -O2 -Wall -o poc207_t123 poc/poc207_t123.c
      - name: debug pre-run (200 iters, full event trace for diagnosis)
        run: |
          POC207_DEBUG=1 timeout 120 ./poc207_t123 200 0 > pre.out 2> pre.err || true
          head -12 pre.err || true
          tail -12 pre.err || true
      - name: T1 — divergence detector (0<->sentinel toggle), up to 1e6 polls
        run: |
          timeout 900 ./poc207_t123 1000000 0 | tee t1.out
          grep -E '^(RESULT|VERDICT)' t1.out
      - name: T3 — real-fd probe (0<->fifo fd3 toggle), up to 1e6 polls
        run: |
          timeout 900 ./poc207_t123 1000000 1 | tee t3.out
          grep -E '^(RESULT|VERDICT)' t3.out
      - name: T2 — window widths are inside the RESULT lines above
        run: echo "T2 = the T2_window_ns RESULT lines of both runs (gate PEEKDATA loop ns + exec-to-read ns)"
