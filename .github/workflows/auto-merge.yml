name: auto-merge
# v8.4-B: event-driven internal auto-merge under the HDAE standing delegation.
# Fires when the ci workflow completes on a PR. Built-in GITHUB_TOKEN only.
# Guardrails live in config/authorization.yml (denylist protects themselves).
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: auto-merge
  cancel-in-progress: false
jobs:
  automerge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Evaluate and merge guarded internal PRs (standing delegation)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 team/scripts/auto-merge.py
