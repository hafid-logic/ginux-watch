name: fuzz

# v2 (v3.2 §1, 2026-11-04): weekly cron + repository_dispatch rounds over CURRENT
# upstream main (no pin). Triggers:
#   - workflow_dispatch (max_seconds input, default 1200 = 3x20min)
#   - schedule: Mondays 05:30 UTC (kept from v1)
#   - repository_dispatch type "fuzz-round" from team-watcher (parser crates
#     touched) with client_payload.seconds (short round = 600) + reason
# Upstream is untrusted: checkout with persist-credentials: false, the fuzz job
# runs with contents: read only. The `record` job (separate, needs: fuzz) is the
# only step with contents: write — it appends results to reports/fuzz-history.md
# in THIS repository with [skip ci]. On crash: artifacts are uploaded; the agent
# minimizes/classifies offline (security findings go to reports/private/ and the
# user only, never upstream).

on:
  workflow_dispatch:
    inputs:
      max_seconds:
        description: "libFuzzer -max_total_time per target (seconds)"
        default: "1200"
  schedule:
    # Mondays 05:30 UTC
    - cron: "30 5 * * 1"
  repository_dispatch:
    types: [fuzz-round]

concurrency:
  group: fuzz-round
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: oci_surfaces,       dict: oci.dict,       seeds: corpus-seed }
          - { target: protocol_surfaces,  dict: protocol.dict,  seeds: corpus-seed-protocol }
          - { target: volume_surfaces,    dict: volume.dict,    seeds: corpus-seed-volume }
    env:
      MAX_SECONDS: ${{ github.event.inputs.max_seconds || github.event.client_payload.seconds || '1200' }}
      TRIGGER: ${{ github.event.client_payload.reason || github.event_name }}
    steps:
      - name: Checkout watch repo (dictionaries + seeds)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout upstream main (untrusted code, no credentials, no pin)
        uses: actions/checkout@v4
        with:
          repository: gmkurtzer/ginux
          ref: refs/heads/main
          path: upstream
          persist-credentials: false

      - name: Record upstream head
        run: |
          echo "UPSTREAM_SHA=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "upstream main @ $(git -C upstream rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Install clang/g++ and pinned toolchain + cargo-fuzz 0.13.2
        run: |
          sudo apt-get update && sudo apt-get install -y clang g++
          cd upstream/fuzz && rustup show
          cargo install cargo-fuzz --locked --version 0.13.2

      - name: Fuzz round (${{ env.MAX_SECONDS }}s)
        working-directory: upstream/fuzz
        run: |
          mkdir -p corpus artifacts
          set -o pipefail
          cargo fuzz run --target x86_64-unknown-linux-gnu --sanitizer address \
            ${{ matrix.target }} -- \
            -max_total_time="${MAX_SECONDS}" \
            -rss_limit_mb=4096 \
            -print_final_stats=1 \
            -artifact_prefix=artifacts/ \
            -dict="$GITHUB_WORKSPACE/fuzz/${{ matrix.dict }}" \
            corpus "$GITHUB_WORKSPACE/fuzz/${{ matrix.seeds }}" \
            2>&1 | tee round-${{ matrix.target }}.log
          test ${PIPESTATUS[0]} -eq 0
          ! ls artifacts/crash-* artifacts/oom-* artifacts/timeout-* artifacts/leak-* 2>/dev/null

      - name: Coverage (llvm-cov summary over seeds + evolved corpus)
        if: success()
        working-directory: upstream/fuzz
        run: |
          cargo fuzz coverage --target x86_64-unknown-linux-gnu ${{ matrix.target }} \
            corpus "$GITHUB_WORKSPACE/fuzz/${{ matrix.seeds }}" \
            2>&1 | tail -3
          LLVM_BIN="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin"
          bin="target/x86_64-unknown-linux-gnu/coverage/x86_64-unknown-linux-gnu/release/${{ matrix.target }}"
          [ -f "$bin" ] || bin="target/x86_64-unknown-linux-gnu/release/${{ matrix.target }}"
          "$LLVM_BIN/llvm-cov" report "$bin" \
            -instr-profile="coverage/${{ matrix.target }}/coverage.profdata" \
            -summary-only -ignore-filename-regex='(fuzz_targets|registry|rustc/|\.cargo)' \
            2>&1 | tee coverage-${{ matrix.target }}.log
          # TOTAL row (recipe of run5, fuzz-branch-verify): $4 regions %, $10 lines %,
          # $13 functions % (absent on current llvm-cov summary -> n/a)
          tail -1 coverage-${{ matrix.target }}.log \
            | awk '{printf "regions %s lines %s functions %s\n", $4, $10, ($13 ? $13 : "n/a")}' \
            | tee coverage-summary-${{ matrix.target }}.txt

      - name: Collect results
        if: always()
        working-directory: upstream/fuzz
        run: |
          execs=$(grep -oE '^#[0-9]+' round-${{ matrix.target }}.log | tail -1 | tr -d '#' || echo 0)
          stats_execs=$(grep -E '^stat::number_of_executed_units' round-${{ matrix.target }}.log | tail -1 | awk '{print $2}' || echo "")
          covline=$(cat coverage-summary-${{ matrix.target }}.txt 2>/dev/null || echo "regions n/a lines n/a functions n/a")
          # count only real crash artifacts — cargo-fuzz pre-creates an empty
          # per-target subdir under artifacts/ (false positive on plain `ls`).
          crashes=$(ls artifacts/crash-* artifacts/oom-* artifacts/timeout-* artifacts/leak-* \
                       artifacts/*/crash-* artifacts/*/oom-* artifacts/*/timeout-* artifacts/*/leak-* \
                       2>/dev/null | wc -l)
          {
            echo "run_id=${{ github.run_id }}"
            echo "run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "trigger=${TRIGGER}"
            echo "upstream_sha=${UPSTREAM_SHA}"
            echo "target=${{ matrix.target }}"
            echo "seconds=${MAX_SECONDS}"
            echo "execs=${stats_execs:-$execs}"
            echo "$covline"
            echo "crash_artifacts=${crashes}"
            echo "round_conclusion=${{ job.status }}"
          } > results-${{ matrix.target }}.txt
          cat results-${{ matrix.target }}.txt

      - name: Upload results + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.target }}
          path: |
            upstream/fuzz/results-*.txt
            upstream/fuzz/round-*.log
            upstream/fuzz/coverage-summary-*.txt
          retention-days: 30

      - name: Upload crash artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-${{ matrix.target }}
          path: upstream/fuzz/artifacts/
          retention-days: 30

  record:
    needs: [fuzz]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout watch repo (writable)
        uses: actions/checkout@v4

      - name: Download round results
        uses: actions/download-artifact@v4
        with:
          pattern: results-*
          merge-multiple: true
          path: round-results

      - name: Update reports/fuzz-history.md
        run: |
          python3 scripts/record-fuzz-history.py \
            --results-dir round-results \
            --history reports/fuzz-history.md \
            --date "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Commit and push history
        run: |
          git config user.name "fuzz-record"
          git config user.email "actions@users.noreply.github.com"
          # s25 fix: the 2026-11-04T17:49Z record job lost a push race vs team-watcher
          # ("fetch first", run 41879122802) — integrate remote main before pushing.
          git pull --rebase --autostash origin main
          git add reports/fuzz-history.md
          if ! git diff --cached --quiet; then
            git commit -m "fuzz history: run ${{ github.run_id }} (head $(grep -h upstream_sha round-results/results-* | head -1 | cut -d= -f2 | cut -c1-8)) [skip ci]"
            git push
          else
            echo "history unchanged"
          fi
